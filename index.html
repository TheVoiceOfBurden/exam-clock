<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Clock — Toilet Availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e13; --panel:#141922; --line:#232a36; --ink:#e8edf5; --mute:#7b8698;
    --vacant:#4cc3ff; --occ:#ffb020; --occ-hot:#ff7a1a;
    --warn:#ffb020; --warn-bg:rgba(255,176,32,.08); --field:#0d1117; --btn:#1f2633; --active-bg:rgba(255,255,255,.04);
  }
  body.light{
    --bg:#f5f6f8; --panel:#ffffff; --line:#d5dae2; --ink:#10151d; --mute:#5f6b7c;
    --warn:#b45309; --warn-bg:rgba(245,158,11,.12); --field:#f5f6f8; --btn:#e9edf2; --active-bg:#ffffff;
  }
  body{transition:background .3s ease,color .3s ease}
  .card label.switch{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:14px}
  .card .switch input{width:auto;transform:scale(1.4);accent-color:var(--ink)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
  .wrap{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:3vh 4vw;gap:2vh}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:2vw}
  #examTitle{font-size:clamp(18px,3.2vw,44px);font-weight:800;letter-spacing:.01em}
  #examMeta{font-size:clamp(12px,1.5vw,22px);color:var(--mute);font-family:'JetBrains Mono',monospace;text-align:right}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
  #clock{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(64px,15vw,260px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  #phase{font-size:clamp(14px,2vw,30px);color:var(--mute);text-transform:uppercase;letter-spacing:.2em}
  .times{display:flex;gap:3vw;justify-content:center;margin-top:1vh}
  .tb{border:2px solid var(--line);border-radius:16px;padding:1.4vh 2.4vw;text-align:center;opacity:.7;transition:all .3s ease}
  .tb.active{opacity:1;border-color:var(--ink);background:var(--active-bg)}
  .tb.done{opacity:.35}
  .tb .k{font-size:clamp(12px,1.5vw,24px);font-weight:800;letter-spacing:.25em;color:var(--mute)}
  .tb.active .k{color:var(--ink)}
  .tb .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(28px,5vw,84px);font-variant-numeric:tabular-nums;line-height:1.1}
  .tb.hidden{display:none}
  #warnMsg{margin-top:1.5vh;padding:1vh 2.4vw;border-radius:12px;border:2px solid var(--warn);color:var(--warn);
    background:var(--warn-bg);font-weight:800;letter-spacing:.2em;text-transform:uppercase;
    font-size:clamp(16px,2.4vw,40px);visibility:hidden}
  #warnMsg.show{visibility:visible}

  /* Aircraft-style lavatory signs */
  .signs{display:flex;justify-content:center;gap:4vw}
  .sign{
    cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
    width:clamp(150px,20vw,320px);aspect-ratio:1.55;border-radius:clamp(14px,1.6vw,26px);
    background:linear-gradient(#1b2029,#0f1319);
    border:2px solid #2b323e;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.05), inset 0 -6px 14px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.5);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8vh;
    position:relative;transition:all .25s ease;
  }
  /* frosted lens */
  .sign::before{content:"";position:absolute;inset:10%;border-radius:inherit;
    background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.04),transparent 70%);pointer-events:none}
  .sign svg{height:58%;width:auto;overflow:visible;transition:all .25s ease}
  .sign .fig{fill:#3a4250}
  .sign .lbl{font-weight:800;letter-spacing:.22em;font-size:clamp(14px,1.9vw,32px);transition:all .25s ease}
  .sign .since{position:absolute;bottom:6%;font-family:'JetBrains Mono',monospace;font-size:clamp(9px,.8vw,13px);color:var(--mute);opacity:0}

  /* Colour-blind safe: VACANT = dark panel, hollow blue outline figure.
     OCCUPIED = fully lit amber panel, solid dark figure. The difference is
     brightness and shape, not just hue, and the words are large. */
  .sign.vacant .lbl{color:var(--vacant);text-shadow:0 0 10px rgba(76,195,255,.5)}
  .sign.vacant .fig{fill:transparent;stroke:var(--vacant);stroke-width:2.5;stroke-linejoin:round}
  .sign.vacant{border-color:#1f4a63}
  body.light .sign.vacant svg{filter:drop-shadow(0 0 5px rgba(76,195,255,.5))}

  .sign.occ{
    background:radial-gradient(ellipse at 50% 45%,#ffd36a,#f59e0b 75%);
    border-color:#ffd36a;
    box-shadow:0 0 0 2px rgba(255,211,106,.5), 0 0 48px rgba(255,160,20,.55), inset 0 0 24px rgba(255,255,255,.35);
  }
  .sign.occ .fig{fill:#2a1600}
  .sign.occ .lbl{color:#2a1600;text-shadow:none}
  
  .sign:active{transform:scale(.98)}
  .sign.closed{cursor:not-allowed;border-color:#5a1f24;
    background:linear-gradient(#1d1416,#120c0d)}
  .sign.closed .fig{fill:#4a3336}
  .sign.closed .lbl{color:#ff5a5f;text-shadow:0 0 10px rgba(255,90,95,.6)}
  .sign.closed::after{content:"";position:absolute;left:28%;right:28%;top:40%;height:4px;
    background:#ff5a5f;border-radius:2px;transform:rotate(-35deg);box-shadow:0 0 10px rgba(255,90,95,.7)}
  .sign.closed:active{transform:none}

  footer{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:clamp(10px,1vw,14px)}
  footer button{background:none;border:1px solid var(--line);color:var(--mute);padding:.5em .9em;border-radius:8px;font:inherit;cursor:pointer}
  footer button:hover{color:var(--ink);border-color:var(--mute)}
  .keys kbd{font-family:'JetBrains Mono',monospace;border:1px solid var(--line);border-radius:4px;padding:0 .35em;margin:0 .15em}
  body.clean footer{opacity:0;transition:opacity .4s}
  body.clean footer:hover{opacity:1}
  body.is-full footer{display:none}
  body.nocursor, body.nocursor *{cursor:none !important}

  /* panels */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:10}
  .modal.open{display:flex}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(520px,92vw);max-height:86vh;overflow:auto}
  .card h2{font-size:18px;margin-bottom:14px}
  .card label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
  .card input{width:100%;background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 10px;font:inherit}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .actions button{background:var(--btn);border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer}
  .actions button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
  #logList{font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:#c9d1dd;min-height:60px}
</style>
</head>
<body class="clean">
<div class="wrap">
  <header>
    <div id="examTitle">Examination</div>
    <div id="examMeta"></div>
  </header>

  <section class="center">
    <div id="phase">Current time</div>
    <div id="clock">--:--:--</div>
    <div class="times">
      <div class="tb" id="tbRead"><div class="k">READING</div><div class="v" id="vRead"></div></div>
      <div class="tb" id="tbWrite"><div class="k">WRITING</div><div class="v" id="vWrite"></div></div>
    </div>
    <div id="warnMsg"></div>
  </section>

  <section>
    <div class="signs">
      <div class="sign vacant" id="signM" title="Toggle (M or 1)">
        <svg viewBox="0 0 60 100" aria-hidden="true"><g class="fig">
          <circle cx="30" cy="11" r="10"/>
          <path d="M14 26h32a6 6 0 0 1 6 6v28a4 4 0 0 1-8 0V36h-2v58a5 5 0 0 1-10 0V62h-4v32a5 5 0 0 1-10 0V36h-2v24a4 4 0 0 1-8 0V32a6 6 0 0 1 6-6z"/>
        </g></svg>
        <div class="lbl">VACANT</div>
        <div class="since"></div>
      </div>
      <div class="sign vacant" id="signF" title="Toggle (F or 2)">
        <svg viewBox="0 0 60 100" aria-hidden="true"><g class="fig">
          <circle cx="30" cy="11" r="10"/>
          <path d="M20 26h20a6 6 0 0 1 5.8 4.5l7 26a4 4 0 0 1-7.7 2L39 38h-1l9 32H38v24a5 5 0 0 1-10 0V70h-0v24a5 5 0 0 1-10 0V70h-5l9-32h-1l-6 20.5a4 4 0 0 1-7.7-2l7-26A6 6 0 0 1 20 26z"/>
        </g></svg>
        <div class="lbl">VACANT</div>
        <div class="since"></div>
      </div>
    </div>
  </section>

  <footer>
    <div class="keys"><span id="roomBadge"></span> Toggle: <kbd>M</kbd>/<kbd>1</kbd> male · <kbd>F</kbd>/<kbd>2</kbd> female · <kbd>R</kbd> reset both · <kbd>L</kbd> log · <kbd>S</kbd> setup · <kbd>⌘F</kbd>/<kbd>Ctrl+F</kbd> full screen · <a href="small.html" style="color:var(--mute)">Small room</a> · <a href="provisions.html" style="color:var(--mute)">Special provisions</a></div>
    <div>
      <button id="btnSetup">Exam setup</button>
      <button id="btnLog">Log</button>
      <button id="btnFull" title="Cmd+F / Ctrl+F">Full screen</button>
    </div>
  </footer>
</div>

<div class="modal" id="setup">
  <div class="card">
    <h2>Exam setup</h2>
    <label>Exam title</label>
    <input id="inTitle" placeholder="Year 12 Mathematical Methods — Exam 1">
    <div class="row">
      <div><label>Start (reading)</label><input id="inStart" type="time"></div>
      <div><label>Reading (min)</label><input id="inRead" type="number" min="0" step="1"></div>
      <div><label>Writing (min)</label><input id="inWrite" type="number" min="1" step="1"></div>
    </div>
    <label>Show a warning this many minutes before writing ends (0 = off)</label>
    <input id="inWarn" type="number" min="0" step="1">
    <label class="switch">Light mode <input id="inLight" type="checkbox"></label>

    <h2 style="margin-top:22px">Phone remote</h2>
    <div id="remoteBox">
      <p id="remoteStatus" style="font-size:14px;color:var(--mute)">Not configured — see README.</p>
      <div id="remoteQR" style="display:none;background:#fff;padding:12px;border-radius:10px;width:max-content;margin:12px 0"></div>
      <p id="remoteLink" style="font-size:12px;word-break:break-all;color:var(--mute)"></p>
      <div class="actions" style="justify-content:flex-start">
        <button id="btnRemoteStart" style="display:none">Start phone remote</button>
        <button id="btnRemoteCopy" style="display:none">Copy link</button>
        <button id="btnRemoteEnd" style="display:none">End remote</button>
      </div>
    </div>
    <div class="actions">
      <button id="btnCancel">Cancel</button>
      <button class="primary" id="btnSave">Save</button>
    </div>
  </div>
</div>

<div class="modal" id="log">
  <div class="card">
    <h2>Toilet break log</h2>
    <div id="logList"></div>
    <div class="actions">
      <button id="btnClearLog">Clear</button>
      <button id="btnCopyLog">Copy</button>
      <button class="primary" id="btnCloseLog">Close</button>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const store = {
    get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };

  const now0 = new Date();
  const defStart = String(now0.getHours()).padStart(2,'0') + ':' + String(now0.getMinutes()).padStart(2,'0');
  let cfg = store.get('examcfg', null) || {title:'Examination', start:defStart, read:15, write:90, warn:10};
  let log = store.get('examlog', []);

  const signs = {
    M:{el:$('signM'), name:'Male', occ:false, since:null},
    F:{el:$('signF'), name:'Female', occ:false, since:null}
  };

  const pad = n => String(n).padStart(2,'0');
  const hms = d => pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  const hm = d => pad(d.getHours())+':'+pad(d.getMinutes());
  const dur = ms => { ms = Math.max(0, Math.ceil(ms/1000)); const h=Math.floor(ms/3600), m=Math.floor(ms%3600/60), s=ms%60; return (h? h+':'+pad(m) : m)+':'+pad(s); };

  function times(){
    const [h,m] = (cfg.start||'00:00').split(':').map(Number);
    const s = new Date(); s.setHours(h,m,0,0);
    const w = new Date(s.getTime() + cfg.read*60000);
    const e = new Date(w.getTime() + cfg.write*60000);
    return {s,w,e};
  }

  function renderHeader(){
    const {s,w,e} = times();
    $('examTitle').textContent = cfg.title || 'Examination';
    $('examMeta').textContent = '';
    $('vRead').textContent = hm(s)+' – '+hm(w);
    $('vWrite').textContent = hm(w)+' – '+hm(e);
    $('tbRead').classList.toggle('hidden', !(cfg.read>0));
  }

  function tick(){
    const n = new Date();
    $('clock').textContent = hms(n);
    const {s,w,e} = times();
    const nowClosed = n >= new Date(e.getTime() - CLOSE_MIN*60000);
    if (nowClosed !== closed){
      closed = nowClosed;
      if (closed) for (const k in signs) if (signs[k].occ) log.push(hms(n)+'  '+signs[k].name.padEnd(6)+'  STILL OUT at closing');
      store.set('examlog', log);
      paint('M'); paint('F');
      if (window.Remote) Remote.onClosedChange(closed);
    }
    let phase;
    if (n < s) phase='Exam not yet started';
    else if (n < w) phase='Reading time — no writing';
    else if (n < e) phase='Writing time';
    else phase='Exam finished — pens down';
    $('phase').textContent = phase;
    $('tbRead').classList.toggle('active', n>=s && n<w);
    $('tbRead').classList.toggle('done', n>=w);
    $('tbWrite').classList.toggle('active', n>=w && n<e);
    $('tbWrite').classList.toggle('done', n>=e);
    const wm = cfg.warn ?? 10;
    const showWarn = wm > 0 && n >= w && n < e && (e - n) <= wm*60000;
    if (n >= e){
      $('warnMsg').textContent = 'Exam finished — pens down';
      $('warnMsg').classList.add('show');
    } else {
      const left = Math.max(1, Math.ceil((e - n)/60000));
      $('warnMsg').textContent = left + (left===1 ? ' minute' : ' minutes') + ' of writing time remaining';
      $('warnMsg').classList.toggle('show', showWarn);
    }
  }

  const CLOSE_MIN = 15;   // toilets close for the last 15 minutes of writing
  let closed = false;
  function paint(k){
    const sg = signs[k];
    sg.el.classList.toggle('closed', closed);
    sg.el.classList.toggle('occ', !closed && sg.occ);
    sg.el.classList.toggle('vacant', !closed && !sg.occ);
    sg.el.querySelector('.lbl').textContent = closed ? 'CLOSED' : (sg.occ ? 'OCCUPIED' : 'VACANT');
    sg.el.title = closed ? 'Closed for the final ' + CLOSE_MIN + ' minutes' : 'Toggle';
  }

  function toggle(k, force, src, fromDb){
    const sg = signs[k];
    const next = (force === undefined) ? !sg.occ : force;
    if (next === sg.occ) return;
    // While closed, nobody can be marked out; a student already out can still be marked back for the log.
    if (closed && next) return;
    // With a phone-remote session running, the database is the source of truth:
    // write there and let the change come back through ExamClock.remoteState().
    if (!fromDb && window.Remote && Remote.active()) { Remote.set(k, next); return; }
    const n = new Date();
    const tag = src ? '  ['+src+']' : '';
    if (next){ sg.since = n; log.push(hms(n)+'  '+sg.name.padEnd(6)+'  OUT'+tag); }
    else { log.push(hms(n)+'  '+sg.name.padEnd(6)+'  BACK  ('+(sg.since ? dur(n - sg.since) : '?')+')'+tag); sg.since = null; }
    sg.occ = next;
    store.set('examlog', log);
    paint(k); tick();
  }

  window.ExamClock = {
    cfg: () => cfg,
    times,
    isClosed: () => closed,
    CLOSE_MIN,
    state: () => ({ M: signs.M.occ, F: signs.F.occ }),
    // Called by the remote module whenever the database changes.
    remoteState(k, occ, src){ if (signs[k].occ !== occ) toggle(k, occ, src === 'key' ? '' : (src || 'phone'), true); }
  };

  signs.M.el.addEventListener('click', ()=>toggle('M'));
  signs.F.el.addEventListener('click', ()=>toggle('F'));

  document.addEventListener('keydown', ev=>{
    // Cmd+F (Mac) / Ctrl+F (Windows): toggle borderless full screen instead of the browser's Find.
    if ((ev.metaKey || ev.ctrlKey) && !ev.altKey && !ev.shiftKey && ev.key.toLowerCase() === 'f') {
      ev.preventDefault();
      if (!false) toggleFullscreen();
      return;
    }
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;   // leave other shortcuts to the browser
    if (ev.target.tagName === 'INPUT') return;
    const k = ev.key.toLowerCase();
    if (k==='m' || k==='1') toggle('M');
    else if (k==='f' || k==='2') toggle('F');
    else if (k==='r'){ toggle('M',false); toggle('F',false); }
    else if (k==='l') openLog();
    else if (k==='s') openSetup();
    else if (k==='escape'){ $('setup').classList.remove('open'); $('log').classList.remove('open'); }
  });

  function openSetup(){
    $('inTitle').value = cfg.title; $('inStart').value = cfg.start;
    $('inRead').value = cfg.read; $('inWrite').value = cfg.write; $('inWarn').value = (cfg.warn ?? 10); $('inLight').checked = !!cfg.light;
    $('setup').classList.add('open');
  }
  $('btnSetup').onclick = openSetup;
  $('btnCancel').onclick = ()=>$('setup').classList.remove('open');
  $('btnSave').onclick = ()=>{
    cfg = {
      title: $('inTitle').value.trim() || 'Examination',
      start: $('inStart').value || defStart,
      read: Math.max(0, parseInt($('inRead').value)||0),
      write: Math.max(1, parseInt($('inWrite').value)||60),
      warn: Math.max(0, parseInt($('inWarn').value)||0),
      light: $('inLight').checked
    };
    store.set('examcfg', cfg);
    $('setup').classList.remove('open');
    applyTheme(); renderHeader(); tick();
    if (window.Remote) Remote.onSettings();
  };
  function applyTheme(){ document.body.classList.toggle('light', !!cfg.light); }

  function openLog(){
    $('logList').textContent = log.length ? log.join('\n') : 'No toilet breaks recorded yet.';
    $('log').classList.add('open');
  }
  $('btnLog').onclick = openLog;
  $('btnCloseLog').onclick = ()=>$('log').classList.remove('open');
  $('btnClearLog').onclick = ()=>{ log = []; store.set('examlog', log); openLog(); };
  $('btnCopyLog').onclick = ()=>{
    const txt = (cfg.title||'Exam')+'\n'+log.join('\n');
    try{ navigator.clipboard.writeText(txt).then(()=>{$('btnCopyLog').textContent='Copied';setTimeout(()=>$('btnCopyLog').textContent='Copy',1500);}).catch(()=>{}); }catch(e){}
  };

  function toggleFullscreen(){
    try{
      if (!document.fullscreenElement) document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
    }catch(e){}
  }
  $('btnFull').onclick = toggleFullscreen;
  // In full screen, hide the mouse pointer after 2 seconds without movement.
  let cursorTimer = null;
  function wakeCursor(){
    document.body.classList.remove('nocursor');
    clearTimeout(cursorTimer);
    if (document.fullscreenElement) cursorTimer = setTimeout(()=>document.body.classList.add('nocursor'), 2000);
  }
  document.addEventListener('mousemove', wakeCursor);
  document.addEventListener('fullscreenchange', ()=>{
    document.body.classList.toggle('is-full', !!document.fullscreenElement);
    $('btnFull').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
    wakeCursor();
  });

  paint('M'); paint('F'); applyTheme(); renderHeader(); tick();
  setInterval(tick, 250);
})();
</script>
<script src="js/vendor/qrcode.js"></script>
<script type="module" src="js/display-remote.js"></script>
</body>
</html>
