<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Toilet Remote — Exam Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0b0e13; --line:#232a36; --ink:#e8edf5; --mute:#7b8698; --vacant:#3ddc84; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  main{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
  .rhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .rhead h1{font-size:20px;font-weight:800}
  .rstat{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;background:#6b7280}
  .dot.ok{background:var(--vacant);box-shadow:0 0 8px var(--vacant)}
  .dot.bad{background:#ff5a5f}
  #rTitle{font-size:15px;color:var(--mute)}
  .rbtns{display:grid;grid-template-columns:1fr;gap:14px;flex:1}
  @media (min-width:600px){.rbtns{grid-template-columns:1fr 1fr}}
  .rb{border-radius:22px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
      font:inherit;color:#fff;background:#1b2029;border:2px solid #2b323e;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .2s}
  .rb svg{height:70px;width:auto}
  .rb .fig{fill:#3a4250}
  .rb .nm{font-size:15px;letter-spacing:.15em;color:#aab3c2;font-weight:700}
  .rb .st{font-size:24px;font-weight:800;letter-spacing:.2em}
  .rb .hint{font-size:13px;color:#aab3c2}
  .rb.vacant{border-color:#2f7a4f}
  .rb.vacant .fig{fill:var(--vacant)} .rb.vacant .st{color:var(--vacant)}
  .rb.occ{background:radial-gradient(ellipse at 50% 45%,#5a3500,#2a1800 75%);border-color:#b8740c;box-shadow:0 0 24px rgba(255,140,20,.35)}
  .rb.occ .fig{fill:#ffd27a} .rb.occ .st{color:#ffe1a0}
  .rb.closed{background:linear-gradient(#1d1416,#120c0d);border-color:#5a1f24}
  .rb.closed .fig{fill:#4a3336} .rb.closed .st{color:#ff5a5f}
  .rb.wait{opacity:.6}
  .rb:disabled{cursor:not-allowed;opacity:.55}
  .rb:active:not(:disabled){transform:scale(.98)}
  #rMsg{font-size:14px;color:var(--mute);text-align:center;min-height:1.2em}
</style>
</head>
<body>
<main>
  <div class="rhead">
    <h1>Toilet remote</h1>
    <div class="rstat"><span class="dot" id="rDot"></span><span id="rConn">Connecting…</span></div>
  </div>
  <div id="rTitle"></div>
  <div class="rbtns">
    <button class="rb wait" id="rbM" disabled>
      <svg viewBox="0 0 60 100" aria-hidden="true"><g class="fig"><circle cx="30" cy="11" r="10"/><path d="M14 26h32a6 6 0 0 1 6 6v28a4 4 0 0 1-8 0V36h-2v58a5 5 0 0 1-10 0V62h-4v32a5 5 0 0 1-10 0V36h-2v24a4 4 0 0 1-8 0V32a6 6 0 0 1 6-6z"/></g></svg>
      <div class="nm">MALE</div><div class="st">—</div><div class="hint"></div>
    </button>
    <button class="rb wait" id="rbF" disabled>
      <svg viewBox="0 0 60 100" aria-hidden="true"><g class="fig"><circle cx="30" cy="11" r="10"/><path d="M20 26h20a6 6 0 0 1 5.8 4.5l7 26a4 4 0 0 1-7.7 2L39 38h-1l9 32H38v24a5 5 0 0 1-10 0V70h-0v24a5 5 0 0 1-10 0V70h-5l9-32h-1l-6 20.5a4 4 0 0 1-7.7-2l7-26A6 6 0 0 1 20 26z"/></g></svg>
      <div class="nm">FEMALE</div><div class="st">—</div><div class="hint"></div>
    </button>
  </div>
  <div id="rMsg"></div>
</main>
<script type="module" src="js/remote.js"></script>
</body>
</html>
